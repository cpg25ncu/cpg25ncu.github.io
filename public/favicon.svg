<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208">
  <!-- TL mark on a 5×5 grid of 22px strokes; follows the browser's light / dark appearance -->
  <style>
    .tile { fill: #19191c; }
    .mark { fill: #f1f0f3; }
    .dot { fill: #238dfc; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #efeff1; }
      .mark { fill: #1e1d1f; }
      .dot { fill: #1684fc; }
    }
  </style>
  <rect class="tile" width="208" height="208" rx="26" />
  <path class="mark" d="M42 49H152V71H108V137H152V159H86V71H42Z" />
  <rect class="dot" x="130" y="93" width="22" height="22" />
</svg>
